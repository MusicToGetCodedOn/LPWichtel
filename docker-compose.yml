services:
  postgres:
    image: postgres:16-alpine
    container_name: lpwichtel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wichtel
    ports:
      - "5432:5432"
    volumes:
      - lpwichtel-postgres-data:/var/lib/postgresql/data

volumes:
  lpwichtel-postgres-data: